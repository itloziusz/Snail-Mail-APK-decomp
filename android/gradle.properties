# Plain android.app.Activity shell: no AndroidX/Jetpack dependencies at all.
android.useAndroidX=false
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=false
# Optional: directory holding the original APK assets (asm.mp3 + *.ogg).
# They are proprietary inputs and are never committed; by default the build
# uses ../work/apk_unzip/assets when it exists (see app/build.gradle.kts).
# snailmail.assetsDir=/absolute/path/to/assets
